name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onconexus
          POSTGRES_PASSWORD: onconexus
          POSTGRES_DB: onconexus_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U onconexus -d onconexus_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key

      POSTGRES_USER: onconexus
      POSTGRES_PASSWORD: onconexus
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: onconexus_test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify database configuration
        run: |
          python -c "from app.core.config import settings; print(settings.DATABASE_URL)"

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import time
          import psycopg

          for attempt in range(30):
              try:
                  connection = psycopg.connect(
                      host="127.0.0.1",
                      port=5432,
                      user="onconexus",
                      password="onconexus",
                      dbname="onconexus_test_db",
                  )
                  connection.close()
                  print("PostgreSQL is ready")
                  break
              except Exception as error:
                  print(f"Waiting for PostgreSQL: {error}")
                  time.sleep(2)
          else:
              raise SystemExit("PostgreSQL did not become ready")
          PY

      - name: Lint with flake8
        run: flake8 app --max-line-length=100 || true

      - name: Type check with mypy
        run: mypy app || true

      - name: Run backend tests
        run: pytest -v

  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint || true

      - name: Type check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build