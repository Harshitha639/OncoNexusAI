# Production overrides. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ./backend
      target: production
    volumes:
      - report_storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always

  frontend:
    build:
      context: ./frontend
      target: production
    volumes: []
    ports:
      - "80:80"
    restart: always

volumes:
  report_storage:
